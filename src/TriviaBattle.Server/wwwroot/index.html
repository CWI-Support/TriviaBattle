<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trivia Battle - Screens</title>
    <link rel="icon" href="/favicon.svg">
    <link rel="stylesheet" href="/css/screens.css">
    <style>
        body { overflow: auto; padding: 32px; }
        .launcher { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
        .launcher h1 { font-size: 64px; color: var(--accent); }
        .launcher h2 { font-size: 32px; }
        .launcher a { color: var(--text); display: inline-block; margin: 6px 12px 6px 0; padding: 10px 16px;
                      background: var(--panel); border-radius: 8px; text-decoration: none; border-left: 6px solid var(--link-color, var(--accent)); }
        .launcher a:hover { background: var(--panel-light); }
        .launcher .operator a { font-size: 20px; padding: 16px 22px; }
        .launcher a small { display: block; font-size: 13px; color: var(--text-dim); }
        .launcher a.is-open { opacity: 0.6; }
        .launcher a.is-open small { color: var(--wrong); }
    </style>
</head>
<body>
    <!-- Operator launcher: links to every screen. Each screen gets its role from its URL,
         so these links work the same on one PC or across machines on the LAN. -->
    <div class="launcher">
        <h1>Trivia Battle</h1>
        <p class="operator">
            <a href="/operator">Operator: sound &amp; volume, game rules, theme</a>
            <a href="/admin#questions" style="--link-color: var(--text-dim)">Questions &amp; players</a>
        </p>
        <p class="dim">Open each screen in its own window (or on its own device). Add <code>?devkeys=1</code> to a
           screen to drive the buttons from that window's keyboard.</p>
        <div id="rooms"></div>
    </div>

    <script src="/js/ui.js"></script>
    <script>
        // Station screens need https for their camera (hero photos), except on this PC (localhost). Opened
        // from another PC over http, the station links go to the server's https address instead.
        // Each station says whether a screen is already open as it (and where), so a second PC picks a
        // free one: two screens as one station both take its hero photo. Asked again every few seconds.
        const show = () => Promise.all([fetch('/api/rooms').then(r => r.json()), fetch('/api/display').then(r => r.json())]).then(([{ devToolsEnabled, rooms, screens }, { httpsPort }]) => {
            const secure = !window.isSecureContext && httpsPort ? `https://${location.hostname}:${httpsPort}` : '';
            document.getElementById('rooms').innerHTML = (secure ? `<p class="dim">Station links open the secure address, so their cameras work. The first time,
                the browser warns about it: click Advanced, then Proceed. Then Allow the camera.</p>` : '') + rooms.map(room => {
                const q = rooms.length > 1 ? `?room=${room.id}` : '';
                const players = room.stations.map(s => {
                    const open = screens[`player:${s.id}`] || [];
                    const where = open.length ? `open on ${open.map(a => UI.escape(a || '?')).join(', ')}` : 'free';
                    return `<a href="${secure}/display/player/${s.number}${q}" class="${open.length ? 'is-open' : ''}" style="--link-color:${s.color}">${UI.escape(s.label)}<small>${where}</small></a>`;
                }).join('');
                const dev = devToolsEnabled
                    ? `<p><a href="/dev/buttons${q}">Dev buttons (keyboard)</a>
                          <a href="/display/main${q ? q + '&' : '?'}devkeys=1">Main screen + keyboard buttons</a>
                          <a href="/kiosk${q ? q + '&' : '?'}dev=1">Kiosk + simulated cards</a></p>`
                    : '';
                return `
                    <h2>${UI.escape(room.name)} (room ${UI.escape(room.id)})</h2>
                    <p><a href="/kiosk${q}">Kiosk</a><a href="/display/main${q}">Main screen</a></p>
                    <p>${players}</p>
                    ${dev}`;
            }).join('');
        });
        show();
        setInterval(() => show().catch(() => {}), 4000);
    </script>
</body>
</html>
