<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trivia Battle - Player Screen</title>
    <link rel="icon" href="/favicon.svg">
    <link rel="stylesheet" href="/css/screens.css">
    <link rel="stylesheet" href="/css/dungeon.css">
    <link rel="stylesheet" href="/css/dungeon-battle.css">
    <link rel="stylesheet" href="/css/dungeon-encounter.css">
    <link rel="stylesheet" href="/css/dungeon-powerups.css">
    <link rel="stylesheet" href="/css/battle3d.css">
    <link rel="stylesheet" href="/css/hero-photo.css">
    <!-- The 3D fight (js/battle3d): three.js is vendored, and modules find it through this map. -->
    <script type="importmap">
        { "imports": { "three": "/lib/three/three.module.min.js", "three/addons/": "/lib/three/addons/" } }
    </script>
</head>
<body>
    <div class="theme-backdrop"></div>
    <div id="stage3d"></div>
    <!-- URL: /display/player/{station number}[?room=A][&view=2d]. player-screen.js does the rest. -->
    <video id="intro-video" class="synced-video" playsinline hidden></video>

    <div class="player-screen">
        <header class="player-header">
            <span class="station-label" id="station-label"></span>
            <span class="player-name" id="player-name"></span>
            <span class="player-score" id="player-score"></span>
        </header>
        <main class="player-body" id="player-body"></main>
    </div>

    <script src="/lib/signalr/signalr.min.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/screen-connection.js"></script>
    <script src="/js/station-keypad.js"></script>
    <script src="/js/synced-video.js"></script>
    <script src="/js/pixel-sprites.js"></script>
    <script src="/js/hero-photo.js"></script>
    <script src="/js/hero-camera.js"></script>
    <script src="/js/dungeon-view.js"></script>
    <script src="/js/dungeon-powerups.js"></script>
    <script src="/js/dungeon-encounter.js"></script>
    <script src="/js/dungeon-battle.js"></script>
    <script src="/js/player-screen.js"></script>
</body>
</html>
